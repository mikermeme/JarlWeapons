<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Weapon Stats</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #0f0f0f;
  color: #fff;
  margin: 0;
  padding: 16px;
}

h2 {
  margin: 0;
  padding: 10px;
  cursor: pointer;
  background: #1c1c1c;
  border-radius: 6px;
  user-select: none;
}

.section {
  margin-top: 16px;
}

.section.collapsed .weapon-grid {
  display: none;
}

#search {
  width: 100%;
  padding: 10px;
  margin-bottom: 16px;
  font-size: 16px;
  border-radius: 6px;
  border: none;
}

.weapon-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, 140px);
  gap: 12px;
  margin-top: 10px;
}

.weapon-card {
  border: 1px solid #333;
  padding: 8px;
  background: #181818;
  border-radius: 8px;
}

.sprite-wrap {
  position: relative;
  width: 64px;
  height: 64px;
  margin: auto;
}

.sprite-wrap img {
  width: 64px;
  height: 64px;
  image-rendering: pixelated;
}

.level-badge {
  position: absolute;
  top: -6px;
  right: -6px;
  background: gold;
  color: black;
  font-size: 12px;
  padding: 2px 5px;
  border-radius: 6px;
  font-weight: bold;
}

.weapon-name {
  text-align: center;
  margin-top: 6px;
  font-weight: bold;
  font-size: 14px;
}

.damage-list {
  font-size: 12px;
  margin-top: 6px;
  line-height: 1.4em;
  color: #ccc;
}
</style>
</head>

<body>

<h1>Weapon Stats</h1>

<input id="search" placeholder="Search weapons..." />

<div id="weapons"></div>

<script>
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTGlBhM2phLsu16Kgj0rOg-IaqMRLMNLYaowGHYoLHp5jvIkADZzOkGQP9PO82mrqRZ72EV4-d7D4VT/pub?gid=0&single=true&output=csv";

let weapons = [];

fetch(SHEET_URL)
  .then(r => r.text())
  .then(csv => {
    weapons = parseCSV(csv);
    render();
  });

/* ---------------- CSV + SCHEMA ---------------- */

function parseCSV(csv) {
  const rows = csv.trim().split("\n").map(r => r.split(","));
  const headers = rows[0];

  const baseMap = new Map();
  const scaleMap = new Map();

  headers.forEach((h, i) => {
    if (!h) return;

    const clean = h.trim();

    if (clean.toLowerCase().endsWith("base")) {
      baseMap.set(clean.replace(/base$/i, "").trim(), i);
    }
    if (clean.toLowerCase().endsWith("scale")) {
      scaleMap.set(clean.replace(/scale$/i, "").trim(), i);
    }
  });

  return rows.slice(1).map(row => {
    const name = (row[0] || "").trim();
    const sprite = row[1];
    const type = (row[2] || "").trim();
    const rawLevel = Number(row[3]) || 0;

    const isWooden = name.toLowerCase().includes("wooden");
    const displayLevel = isWooden ? rawLevel * 5 : rawLevel;

    const w = {
      name,
      sprite,
      type,
      level: rawLevel,
      displayLevel,
      isWooden,
      cost: Number(row[4]) || 0,
      damage: []
    };

    // skip blank types entirely
    if (!type) return w;

    const keys = new Set([...baseMap.keys(), ...scaleMap.keys()]);

    keys.forEach(k => {
      const b = baseMap.get(k);
      const s = scaleMap.get(k);

      const base = b != null ? Number(row[b]) || 0 : 0;
      const scale = s != null ? Number(row[s]) || 0 : 0;

      if (base === 0 && scale === 0) return;

      w.damage.push({
        type: k,
        base,
        scale,
        total: base + scale * (rawLevel-1) // IMPORTANT: NOT displayLevel
      });
    });

    return w;
  }).filter(w => w.type); // remove blank types
}

/* ---------------- SEARCH ---------------- */

document.getElementById("search").addEventListener("input", render);

function matchesSearch(w, q) {
  if (!q) return true;
  q = q.toLowerCase();

  return (
    w.name.toLowerCase().includes(q) ||
    w.type.toLowerCase().includes(q) ||
    w.sprite.toLowerCase().includes(q) ||
    w.damage.some(d => d.type.toLowerCase().includes(q))
  );
}

/* ---------------- RENDER ---------------- */

function render() {
  const container = document.getElementById("weapons");
  container.innerHTML = "";

  const query = document.getElementById("search").value;

  const grouped = {};

  weapons
    .filter(w => w.type && matchesSearch(w, query))
    .forEach(w => {
      if (!grouped[w.type]) grouped[w.type] = [];
      grouped[w.type].push(w);
    });

  Object.keys(grouped).forEach(type => {
    const section = document.createElement("div");
    section.className = "section";

    const title = document.createElement("h2");
    title.textContent = type;

    title.onclick = () => {
      section.classList.toggle("collapsed");
    };

    const grid = document.createElement("div");
    grid.className = "weapon-grid";

    grouped[type].forEach(w => {
      grid.appendChild(createCard(w));
    });

    section.appendChild(title);
    section.appendChild(grid);
    container.appendChild(section);
  });
}

/* ---------------- CARD ---------------- */

function createCard(w) {
  const card = document.createElement("div");
  card.className = "weapon-card";

  const spriteWrap = document.createElement("div");
  spriteWrap.className = "sprite-wrap";

  const img = document.createElement("img");
  img.src = `sprites/${w.sprite}.png`;

  const level = document.createElement("div");
  level.className = "level-badge";
  level.textContent = w.displayLevel;

  spriteWrap.appendChild(img);
  spriteWrap.appendChild(level);

  const name = document.createElement("div");
  name.className = "weapon-name";
  name.textContent = w.name;

  const dmg = document.createElement("div");
  dmg.className = "damage-list";

  w.damage.forEach(d => {
    const line = document.createElement("div");
    line.style.marginTop = "4px";
    line.style.fontWeight = "bold";
    line.style.color = "#dddddd";
    const scaled = d.scale * (w.level-1);

    if (w.isWooden) {
      line.textContent = `${d.total} ${d.type}`;
    } else if (d.scale > 0) {
      line.textContent = `${d.total} ${d.type} (${d.base} + ${scaled})`;
    } else {
      line.textContent = `${d.total} ${d.type}`;
    }

    dmg.appendChild(line);
  });

  // ---------------- RESOURCE COST ----------------
  const costLine = document.createElement("div");
  costLine.style.marginTop = "4px";
  costLine.style.fontWeight = "bold";
  costLine.style.color = "#ffd27a";

  if ((w.type || "").toLowerCase() === "magic") {
    costLine.textContent = `Eitr: ${w.cost}`;
  } else {
    costLine.textContent = `Stamina: ${w.cost}`;
  }

  dmg.appendChild(costLine);

  card.appendChild(spriteWrap);
  card.appendChild(name);
  card.appendChild(dmg);

  return card;
}
</script>

</body>
</html>
