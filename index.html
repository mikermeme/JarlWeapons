<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Weapon Stats</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #0f0f0f;
  color: #fff;
  margin: 0;
  padding: 16px;
}

h1 {
  text-align: center;;
}

a:link {
  color: #ffa401;
  text-decoration: none;
}

a:visited {
  color: #a00;
}

h2 {
  margin: 0;
  padding: 10px;
  cursor: pointer;
  background: #1c1c1c;
  border-radius: 6px;
  user-select: none;
}

* {
  box-sizing: border-box;
}

html, body {
  overflow-x: hidden;
  max-width: 100%;
}

.section {
  margin-top: 10px;
  margin-right: 10px;
}

.section.collapsed .weapon-grid {
  display: none;
}

#search {
  width: 100%;
  padding: 10px;
  margin-bottom: 16px;
  font-size: 16px;
  border-radius: 6px;
  border: none;
}

#loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  padding: 40px 0;
}

.spinner {
  width: 48px;
  height: 48px;

  border: 4px solid #333;
  border-top: 4px solid #fff;
  border-radius: 50%;

  animation: spin 1s linear infinite;
}

.loading-text {
  margin-top: 12px;
  color: #ccc;
  font-size: 14px;
}

@keyframes spin {
  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }
}

.weapon-grid {
  display: grid;

  grid-template-columns:
    repeat(auto-fit, minmax(140px, 1fr));

  gap: 10px;
  margin-top: 10px;

  width: 100%;
}

.weapon-card {
  border: 1px solid #333;
  padding: 10px;
  background: #181818;
  border-radius: 10px;
}

.sprite-wrap {
  position: relative;
  width: 96px;
  height: 96px;
  margin: auto;
}

.sprite {
  width: 96px;
  height: 96px;

  background-image: url("spritesheet.png");
  background-repeat: no-repeat;

  image-rendering: crisp-edges;
  flex-shrink: 0;
}

.level-badge {
  position: absolute;
  top: 0px;
  right: 0px;

  background: none;
  color: #ffa401;

  font-size: 20px;
  font-weight: bold;

  padding: 0;
  border-radius: 0;

  text-shadow: 
  0 0 4px black,
  0 4px 4px rgba(0,0,0,0.8);
}

.weapon-name {
  text-align: center;
  margin-top: 6px;
  font-weight: bold;
  font-size: 16px;
}

.damage-list {
  font-size: 13px;
  margin-top: 6px;
  line-height: 1.4em;
  color: #ccc;
}

#weapons {
  display: block;
  transition: all 0.2s ease;
}

/* When window is wider than tall → 2 columns */
@media (min-aspect-ratio: 1/1) {
  #weapons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    align-items: start;
  }
  .section {
    break-inside: avoid;
  }
}
@media (min-aspect-ratio: 16/9) {
  #weapons {
    grid-template-columns: 1fr 1fr 1fr 1fr;
  }
}

</style>
</head>

<body>

<h1>Jarl Weapon Catalog ⚔️ <a href="https://www.comfyvalheimserver.com/">Join</a> the Comfy Valheim <a href="https://docs.google.com/spreadsheets/d/1Xij6i1JIUT8iAdVgMDuwy9JzZGvMaU0xv85pSJZmElM/edit?usp=sharing">Slayers!</a></h1>

<input id="search" placeholder="Search weapons..." />

<div id="loading">
  <div class="spinner"></div>
  <div class="loading-text">Loading weapons...</div>
</div>

<div id="weapons"></div>

<script>
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTGlBhM2phLsu16Kgj0rOg-IaqMRLMNLYaowGHYoLHp5jvIkADZzOkGQP9PO82mrqRZ72EV4-d7D4VT/pub?gid=0&single=true&output=csv";

const spriteIndexMap = {
  "AtgeirBlackmetal":0,
  "AtgeirBronze":1,
  "AtgeirHimminAfl":2,
  "AtgeirIron":3,
  "AtgeirWood":4,
  "axe_blackmetal":5,
  "axe_bronze":6,
  "axe_flint":7,
  "axe_iron":8,
  "axe_JotunBane":9,
  "axe_stone":10,
  "axe_wood":11,
  "AxeBerzerker":12,
  "AxeBerzerker_Blood":13,
  "AxeBerzerker_Lightning":14,
  "AxeBerzerker_Nature":15,
  "AxeEarly":16,
  "BattleAxe":17,
  "BattleAxe_Blackmetal":18,
  "BattleAxe_crystal":19,
  "BattleAxe_SkullSplittur":20,
  "BattleAxe_wood":21,
  "bow":22,
  "bow_ashlands":23,
  "bow_ashlandsblood":24,
  "bow_ashlandsroot":25,
  "bow_ashlandsstorm":26,
  "bow_draugrfang":27,
  "bow_finewood":28,
  "bow_huntsman":29,
  "bow_spinesnap":30,
  "club":31,
  "crossbow_arbalest":32,
  "crossbow_ripper":33,
  "crossbow_ripper_blood":34,
  "crossbow_ripper_root":35,
  "crossbow_ripper_storm":36,
  "FistBjornClaw":37,
  "FistBjornClawUndead":38,
  "FistFenringClaw":39,
  "knife_blackmetal":40,
  "knife_chitin":41,
  "knife_copper":42,
  "knife_flint":43,
  "knife_silver":44,
  "knife_skollandhati":45,
  "knife_wood":46,
  "MaceBronze":47,
  "MaceEldner":48,
  "MaceEldner_Blood":49,
  "MaceEldner_Lightning":50,
  "MaceEldner_Nature":51,
  "MaceIron":52,
  "MaceNeedle":53,
  "MaceSilver":54,
  "MaceWood":55,
  "pickaxe_antler":56,
  "pickaxe_blackmetal":57,
  "pickaxe_bronze":58,
  "pickaxe_iron":59,
  "pickaxe_stone":60,
  "SledgeDemolisher":61,
  "SledgeIron":62,
  "SledgeStagbreaker":63,
  "SledgeWood":64,
  "SpearAncientbark":65,
  "SpearBronze":66,
  "SpearCarapace":67,
  "SpearFlint":68,
  "SpearSplitner":69,
  "SpearSplitner_Blood":70,
  "SpearSplitner_Lightning":71,
  "SpearSplitner_Nature":72,
  "SpearWolffang":73,
  "SpearWood":74,
  "SwordBlackmetal":75,
  "SwordBronze":76,
  "SwordIron":77,
  "SwordKrom":78,
  "SwordMistwalker":79,
  "SwordNiedhogg":80,
  "SwordNiedhogg_Blood":81,
  "SwordNiedhogg_Lightning":82,
  "SwordNiedhogg_Nature":83,
  "SwordSilver":84,
  "SwordWood":85,
  "Swordwood2h":86,
  "THSwordSlayer":87,
  "THSWordSlayer_Blood":88,
  "THSwordSlayer_Lightning":89,
  "THSwordSlayer_Nature":90,
};

const SPRITE_SIZE = 64;
const DISPLAY_SIZE = 96;
const SPRITES_PER_ROW = 10;
let weapons = [];

fetch(SHEET_URL)
  .then(r => r.text())
  .then(csv => {
    weapons = parseCSV(csv);

    requestAnimationFrame(() => {
      render();
      document.getElementById("loading").style.display = "none";
    });
  });

/* ---------------- CSV + SCHEMA ---------------- */

function parseCSV(csv) {
  const rows = csv.trim().split("\n").map(r => r.split(","));
  const headers = rows[0];

  const baseMap = new Map();
  const scaleMap = new Map();

  headers.forEach((h, i) => {
    if (!h) return;

    const clean = h.trim();

    if (clean.toLowerCase().endsWith("base")) {
      baseMap.set(clean.replace(/base$/i, "").trim(), i);
    }
    if (clean.toLowerCase().endsWith("scale")) {
      scaleMap.set(clean.replace(/scale$/i, "").trim(), i);
    }
  });

  return rows.slice(1).map(row => {
    const name = (row[0] || "").trim();
    const sprite = row[1];
    const type = (row[2] || "").trim();
    const rawLevel = Number(row[3]) || 0;

    const isWooden = name.toLowerCase().includes("wooden");
    const displayLevel = isWooden ? rawLevel * 5 : rawLevel;

    const w = {
      name,
      sprite,
      type,
      level: rawLevel,
      displayLevel,
      isWooden,
      cost: Number(row[4]) || 0,
      damage: []
    };

    // skip blank types entirely
    if (!type) return w;

    const keys = new Set([...baseMap.keys(), ...scaleMap.keys()]);

    keys.forEach(k => {
      const b = baseMap.get(k);
      const s = scaleMap.get(k);

      const base = b != null ? Number(row[b]) || 0 : 0;
      const scale = s != null ? Number(row[s]) || 0 : 0;

      if (base === 0 && scale === 0) return;

      w.damage.push({
        type: k,
        base,
        scale,
        total: base + scale * (rawLevel-1) // IMPORTANT: NOT displayLevel
      });
    });

    return w;
  }).filter(w => w.type); // remove blank types
}

/* ---------------- SEARCH ---------------- */

document.getElementById("search").addEventListener("input", render);

function matchesSearch(w, q) {
  if (!q) return true;
  q = q.toLowerCase();

  return (
    w.name.toLowerCase().includes(q) ||
    w.type.toLowerCase().includes(q) ||
    w.sprite.toLowerCase().includes(q) ||
    w.damage.some(d => d.type.toLowerCase().includes(q))
  );
}

/* ---------------- RENDER ---------------- */

function render() {
  const container = document.getElementById("weapons");
  container.innerHTML = "";

  const query = document.getElementById("search").value;

  const grouped = {};

  weapons
    .filter(w => w.type && matchesSearch(w, query))
    .forEach(w => {
      if (!grouped[w.type]) grouped[w.type] = [];
      grouped[w.type].push(w);
    });

  Object.keys(grouped).forEach(type => {
    const section = document.createElement("div");
    section.className = "section";

    const title = document.createElement("h2");
    title.textContent = type;

    title.onclick = () => {
      const allSections = [...document.querySelectorAll(".section")];

      // Sections visually sharing the same row
      const sameRow = allSections.filter(
        s => s.offsetTop === section.offsetTop
      );

      // Determine whether to collapse or expand
      const shouldCollapse =
        !section.classList.contains("collapsed");

      sameRow.forEach(s => {
        s.classList.toggle("collapsed", shouldCollapse);
      });
    };

    const grid = document.createElement("div");
    grid.className = "weapon-grid";

    grouped[type].forEach(w => {
      grid.appendChild(createCard(w));
    });

    section.appendChild(title);
    section.appendChild(grid);
    container.appendChild(section);
  });
}

/* ---------------- CARD ---------------- */

function createCard(w) {
  const card = document.createElement("div");
  card.className = "weapon-card";

  /* ---------------- SPRITE ---------------- */

  const spriteWrap = document.createElement("div");
  spriteWrap.className = "sprite-wrap";

  const sprite = document.createElement("div");
  sprite.className = "sprite";

  const index = spriteIndexMap[w.sprite];

  // fallback if sprite missing
  if (index == null) {
    sprite.style.background = "#333";
  } else {
    const col = index % SPRITES_PER_ROW;
    const row = Math.floor(index / SPRITES_PER_ROW);

    const x = -(col * DISPLAY_SIZE);
    const y = -(row * DISPLAY_SIZE);

    sprite.style.backgroundPosition = `${x}px ${y}px`;

    // IMPORTANT:
    // scale entire atlas up from 64px -> 96px display
    sprite.style.backgroundSize =
      `${SPRITES_PER_ROW * DISPLAY_SIZE}px auto`;
  }

  /* ---------------- LEVEL ---------------- */

  const level = document.createElement("div");
  level.className = "level-badge";
  level.textContent = w.displayLevel;

  spriteWrap.appendChild(sprite);
  spriteWrap.appendChild(level);

  /* ---------------- NAME ---------------- */

  const name = document.createElement("div");
  name.className = "weapon-name";
  name.textContent = w.name;

  /* ---------------- DAMAGE ---------------- */

  const dmg = document.createElement("div");
  dmg.className = "damage-list";

  w.damage.forEach(d => {
    const line = document.createElement("div");
    line.style.marginTop = "4px";
    line.style.fontWeight = "bold";
    line.style.color = "#dddddd";
    const scaled = d.scale * (w.level-1);

    if (w.isWooden) {
      line.textContent = `${d.type}: ${d.total}`;
    } else if (d.scale > 0) {
      line.textContent = `${d.type}: ${d.total} (${d.base}+${scaled})`;
    } else {
      line.textContent = `${d.type}: ${d.total}`;
    }

    dmg.appendChild(line);
  });

  /* ---------------- RESOURCE COST ---------------- */

  const costLine = document.createElement("div");
  costLine.style.marginTop = "4px";
  costLine.style.fontWeight = "bold";
  costLine.style.color = "#ffd27a";

  if ((w.type || "").toLowerCase() === "magic") {
    costLine.textContent = `Eitr: ${w.cost}`;
  } else {
    costLine.textContent = `Stamina: ${w.cost}`;
  }

  dmg.appendChild(costLine);

  /* ---------------- ASSEMBLE ---------------- */

  card.appendChild(spriteWrap);
  card.appendChild(name);
  card.appendChild(dmg);

  return card;
}
</script>

</body>
</html>
